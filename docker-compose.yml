version: "3.8"

services:
  db:
    image: ankane/pgvector:postgres15
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: hermes
      POSTGRES_DB: hermes_db
    volumes:
      - ./hermes/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  hermes:
    build: ./hermes
    env_file: ./hermes/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./hermes:/app
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000
      - SUPABASE_URL=http://localhost:5432
      - SUPABASE_SERVICE_ROLE_KEY=local-dev-key

  frontend:
    image: nginx:alpine
    volumes:
      - ./stitch_c_digo_bin_rio_console:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      - hermes

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  db_data:
